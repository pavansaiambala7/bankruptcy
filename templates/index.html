<!DOCTYPE html>
<html>
<head><title>Bankruptcy Forecaster</title></head>
<body>
<h1>Bankruptcy Forecasting App</h1>

<label>Load a sample company:</label>
<select id="ss">
  {% for i in range(samples|length) %}
    <option value="{{ i }}">Sample {{ i+1 }} ({{ "BANKRUPT" if samples[i].true_label==1 else "Healthy" }})</option>
  {% endfor %}
</select>
<button type="button" onclick="loadSample()">Load</button>

{% if result %}<div><strong>{{ result }}</strong></div>{% endif %}

<form method="POST" action="/predict" id="mf">
  <div>
  {% for feat in features %}
    <span>
      <label>{{ feat }}</label>
      <input type="number" step="any" id="{{ feat }}" name="{{ feat }}"
             value="{{ values[loop.index0] if values else '' }}" placeholder="0">
    </span>
  {% endfor %}
  </div>
  <button type="submit">Predict</button>
  <button type="reset">Clear</button>
</form>

<script>
const S = {{ samples | tojson }};
function loadSample() {
  const v = S[parseInt(document.getElementById("ss").value)].features;
  document.querySelectorAll("#mf input[type='number']").forEach((el, i) => { el.value = v[i] ?? 0; });
}
</script>
</body>
</html>
